<svg width="680" height="550" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture diagram of the Azure Active Directory lab</title>
<desc>An Azure resource group contains a Windows Server VM promoted to a domain controller. That domain, r3dlab01.local, contains four organizational units: Finance, HR, IT, and Sales, each holding a security group and users. A GPO enforcing password, lockout, and USB policy is linked to the IT OU.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="90" y="40" width="500" height="150" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="110" y="66" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Azure resource group</text>
<text x="110" y="84" font-family="sans-serif" font-size="12" fill="#444441">R3d-testVM &#183; Standard D2s v7</text>

<rect x="210" y="110" width="260" height="56" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Windows Server VM</text>
<text x="340" y="146" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Promoted to domain controller</text>

<line x1="340" y1="190" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="230" width="580" height="150" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="70" y="256" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Active Directory domain</text>
<text x="70" y="274" font-family="sans-serif" font-size="12" fill="#444441">r3dlab01.local</text>

<rect x="70" y="300" width="120" height="60" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Finance</text>
<text x="130" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Group + users</text>

<rect x="210" y="300" width="120" height="60" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="270" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">HR</text>
<text x="270" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Group + users</text>

<rect x="350" y="300" width="120" height="60" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="410" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">IT</text>
<text x="410" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Group + users</text>

<rect x="490" y="300" width="120" height="60" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Sales</text>
<text x="550" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Group + users</text>

<line x1="410" y1="380" x2="410" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420" y="404" font-family="sans-serif" font-size="12" fill="#444441">Applies to IT OU</text>

<rect x="280" y="420" width="260" height="60" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="410" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">IT department GPO</text>
<text x="410" y="456" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Password &#183; lockout &#183; USB policy</text>

<rect x="209" y="500" width="12" height="12" rx="2" fill="#378ADD"/>
<text x="227" y="509" font-family="sans-serif" font-size="12" fill="#444441">AD objects</text>
<rect x="321" y="500" width="12" height="12" rx="2" fill="#BA7517"/>
<text x="339" y="509" font-family="sans-serif" font-size="12" fill="#444441">Policy enforcement</text>
</svg>
